
name: OpenDataLake CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unit -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t opendatalake:ci .

  integration-tests:
    name: Run PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://opendatalake:testpassword@localhost:5432/opendatalake_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://opendatalake:testpassword@localhost:5432/opendatalake_test
      PYTHONPATH: src

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: opendatalake
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: opendatalake_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U opendatalake -d opendatalake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run integration tests
        run: python -m pytest tests/integration -v