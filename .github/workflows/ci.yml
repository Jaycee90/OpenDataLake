
name: OpenDataLake CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unit -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t opendatalake:ci .

  integration-tests:
    name: Run PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://opendatalake:testpassword@localhost:5432/opendatalake_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://opendatalake:testpassword@localhost:5432/opendatalake_test
      TICKETMASTER_API_KEY: ci-test-placeholder
      PYTHONPATH: src

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: opendatalake
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: opendatalake_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U opendatalake -d opendatalake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run integration tests
        run: python -m pytest tests/integration -v

  publish-ecr:
    name: Publish Docker Image to Amazon ECR
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-tests
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::373058354498:role/OpenDataLakeGitHubActionsECR
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: opendatalake
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
